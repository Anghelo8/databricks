name: CI

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - .github/**
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      REPO_PATH: /Workspace/Users/${{ secrets.DATABRICKS_EMAIL }}/databricks

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - uses: databricks/setup-cli@main

    - name: Update Databricks Git folder
      run: databricks repos update "$REPO_PATH" --branch "${{ github.ref_name }}"
