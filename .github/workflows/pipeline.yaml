name: CI

on:
  push:
    paths-ignore:
      - .github/**
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      REPO_PATH: /Workspace/Users/${{ secrets.DATABRICKS_EMAIL }}/databricks

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Setup Databricks CLI
      uses: databricks/setup-cli@v0.2.1

    - name: Update Databricks Git folder
      run: |
        databricks repos update ${{ env.REPO_PATH }} --branch "${GITHUB_REF_NAME}"
